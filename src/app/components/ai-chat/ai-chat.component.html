<!-- Floating Chat Bubble -->
<button (click)="toggleChat()"
  class="fixed bottom-6 right-6 z-[60] w-14 h-14 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full shadow-2xl flex items-center justify-center text-white hover:scale-110 transition-transform duration-300">
  <i class="fas" [ngClass]="isOpen ? 'fa-times' : 'fa-robot'"></i>
</button>

<!-- Chat Window -->
<div *ngIf="isOpen"
  class="fixed bottom-24 right-6 z-[60] w-[350px] sm:w-[400px] h-[500px] bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl flex flex-col overflow-hidden backdrop-blur-xl animate-fade-in-up">

  <!-- Header -->
  <div class="p-4 bg-slate-800 border-b border-slate-700 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-blue-500/20 rounded-full flex items-center justify-center">
        <i class="fas fa-robot text-blue-400"></i>
      </div>
      <div>
        <h4 class="text-slate-100 font-bold">Vikrant AI</h4>
        <div class="flex items-center space-x-1">
          <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
          <span class="text-slate-400 text-xs text-green-400">Online</span>
        </div>
      </div>
    </div>
    <button (click)="toggleChat()" class="text-slate-400 hover:text-white transition-colors">
      <i class="fas fa-minus"></i>
    </button>
  </div>

  <!-- Messages -->
  <div #scrollMe class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-900/50">
    <div *ngFor="let msg of messages" [ngClass]="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
      <div [ngClass]="msg.role === 'user' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-200'"
        class="max-w-[85%] p-3 rounded-2xl text-sm shadow-sm">
        <div class="whitespace-pre-wrap leading-relaxed">{{ msg.content }}</div>
        <div *ngIf="msg.statusMessage"
          class="text-[10px] mt-2 pt-1 border-t border-slate-700/50 flex items-center space-x-1 font-mono"
          [ngClass]="msg.provider === 'groq' ? 'text-emerald-400' : 'text-amber-400'">
          <span>{{ msg.statusMessage }}</span>
        </div>
      </div>
    </div>
    <div *ngIf="isLoading" class="flex justify-start">
      <div class="bg-slate-800 p-3 rounded-2xl flex items-center space-x-2">
        <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce"></div>
        <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce [animation-delay:0.2s]"></div>
        <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce [animation-delay:0.4s]"></div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="p-4 bg-slate-800 border-t border-slate-700">
    <form (submit)="sendMessage()" class="relative">
      <input type="text" name="userInput" [(ngModel)]="userInput" placeholder="Ask something..."
        class="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-full py-2 px-4 pr-12 focus:outline-none focus:border-blue-500 transition-colors">
      <button type="submit" [disabled]="isLoading || !userInput.trim()"
        class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-blue-600 rounded-full text-white flex items-center justify-center hover:bg-blue-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        <i class="fas fa-paper-plane text-xs"></i>
      </button>
    </form>
  </div>
</div>
